<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Manajemen Cafe</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

   
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">CafeKita</a>
        </div>
    </nav>

   
    <section class="hero text-center">
        <div class="container">
            <h1 class="mt-5">Sistem Manajemen CafeKita</h1>
            <p class="lead">Website sederhana untuk mengelola penjualan Cafe.</p>
        </div>
    </section>

   
    <section id="statistik" class="py-5">
        <div class="container">
            <h2 class="text-center mb-4">Statistik Cafe</h2>
            <div class="row">

                <div class="col-md-4 mb-3">
                    <div class="card text-center">
                        <div class="card-body">
                            <h5 class="card-title">
                                <i class="bi bi-basket-fill"></i> Total Menu
                            </h5>
                            <p class="card-text fs-3">2</p>
                        </div>
                    </div>
                </div>

                <div class="col-md-4 mb-3">
                    <div class="card text-center">
                        <div class="card-body">
                            <h5 class="card-title">
                                <i class="bi bi-cart-check-fill"></i> Porsi Terjual Hari Ini
                            </h5>
                            <p class="card-text fs-3">75</p>
                        </div>
                    </div>
                </div>

                <div class="col-md-4 mb-3">
                    <div class="card text-center">
                        <div class="card-body">
                            <h5 class="card-title">
                                <i class="bi bi-cash-stack"></i> Pendapatan Hari Ini
                            </h5>
                            <p class="card-text fs-3">Rp 6.200.000</p>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </section>
    <!-- DAFTAR MENU -->
<section class="py-5">
    <div class="container">
        <h2 class="text-center mb-4">Menu Andalan</h2>

        <div class="row justify-content-center">

            <div class="col-md-4 mb-3 d-flex">
                <div class="card w-100">
                    <img src="assets/beaf-meal.jpg" class="card-img-top" alt="beaf meal">
                    <div class="card-body">
                        <h5 class="card-title">Beef Meals Special</h5>
                        <p class="card-text">Rp 55.000</p>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-3 d-flex">
                <div class="card w-100">
                    <img src="assets/lattecoffe.jpg" class="card-img-top" alt="latte coffe">
                    <div class="card-body">
                        <h5 class="card-title">Coffe latte Expresso Special</h5>
                        <p class="card-text">Rp 21.000</p>
                    </div>
                </div>
            </div>

        </div>
    </div>
</section>

    <footer class="text-center py-3 bg-dark text-white">
        <p>&copy; 2026 Sistem Manajemen Cafe</p>
    </footer>

</body>
</html>
